<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!--
    Hero ambient wash. ~700 bytes, no network cost worth measuring.

    Deliberately abstract: no packaging, no labels, no people. On a pharmacy homepage the
    photographs must be of real stock, and everything else stays out of the way of the
    words. Soft brand teal into warm daylight, which is what the band reads as behind the
    left-hand gradient mask.
  -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F4F7"/>
      <stop offset="0.55" stop-color="#D2EAF0"/>
      <stop offset="1" stop-color="#FBF3E7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#wash)"/>
  <g filter="url(#soft)" opacity="0.5">
    <ellipse cx="930" cy="150" rx="290" ry="200" fill="#7FC8D8"/>
    <ellipse cx="1130" cy="470" rx="240" ry="190" fill="#F2C98A"/>
    <ellipse cx="640" cy="540" rx="260" ry="150" fill="#A9DCC6"/>
  </g>
  <rect width="1200" height="600" fill="url(#glow)"/>
</svg>
